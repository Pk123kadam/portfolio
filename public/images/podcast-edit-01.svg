<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="60%" stop-color="#11151f" />
      <stop offset="100%" stop-color="#161c2b" />
    </linearGradient>
    <linearGradient id="blue-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <pattern id="grid-pattern-1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1" />
    </pattern>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bg-grad-1)" />
  <rect width="1280" height="720" fill="url(#grid-pattern-1)" />

  <!-- Ambient Cinematic Spotlights -->
  <circle cx="950" cy="240" r="280" fill="#2563eb" opacity="0.12" filter="url(#soft-glow)" />
  <circle cx="280" cy="500" r="220" fill="#1e3a8a" opacity="0.1" filter="url(#soft-glow)" />

  <!-- Cinema Frame Guides -->
  <rect x="40" y="40" width="1200" height="640" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  
  <!-- Frame Corner Marks -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#3b82f6" stroke-width="2" />
  <path d="M 1240 70 L 1240 40 L 1210 40" fill="none" stroke="#3b82f6" stroke-width="2" />
  <path d="M 40 650 L 40 680 L 70 680" fill="none" stroke="#3b82f6" stroke-width="2" />
  <path d="M 1240 650 L 1240 680 L 1210 680" fill="none" stroke="#3b82f6" stroke-width="2" />

  <!-- Top Metadata Bar -->
  <text x="80" y="80" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="3">PK EDITS • TIMELINE SEQUENCE</text>
  <text x="1100" y="80" fill="#3b82f6" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1">00:14:20:12</text>
  
  <!-- Dual Microphone Audio Waveform Graphic -->
  <g opacity="0.85" transform="translate(180, 260)">
    <!-- Track 1: Host Voice -->
    <text x="0" y="-12" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">CH 01 • HOST AUDIO (48 kHz / 24-BIT)</text>
    <path d="M 0 30 Q 30 5 60 30 T 120 30 T 180 30 T 240 5 T 300 45 T 360 10 T 420 50 T 480 30 T 540 5 T 600 40 T 660 30 T 720 15 T 780 35 T 840 30 T 920 30" fill="none" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2" />
    <path d="M 0 30 L 920 30" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Waveform Bars -->
    <g fill="#3b82f6" opacity="0.7">
      <rect x="40" y="15" width="4" height="30" rx="2" />
      <rect x="52" y="5" width="4" height="50" rx="2" />
      <rect x="64" y="20" width="4" height="20" rx="2" />
      <rect x="76" y="2" width="4" height="56" rx="2" />
      <rect x="88" y="12" width="4" height="36" rx="2" />
      <rect x="100" y="18" width="4" height="24" rx="2" />
      <rect x="112" y="25" width="4" height="10" rx="2" />
      <rect x="130" y="8" width="4" height="44" rx="2" />
      <rect x="142" y="2" width="4" height="56" rx="2" />
      <rect x="154" y="10" width="4" height="40" rx="2" />
      <rect x="166" y="22" width="4" height="16" rx="2" />
      <rect x="220" y="12" width="4" height="36" rx="2" />
      <rect x="232" y="4" width="4" height="52" rx="2" />
      <rect x="244" y="16" width="4" height="28" rx="2" />
      <rect x="290" y="0" width="4" height="60" rx="2" fill="#60a5fa" />
      <rect x="302" y="8" width="4" height="44" rx="2" />
      <rect x="314" y="18" width="4" height="24" rx="2" />
      <rect x="370" y="10" width="4" height="40" rx="2" />
      <rect x="382" y="3" width="4" height="54" rx="2" />
      <rect x="394" y="14" width="4" height="32" rx="2" />
      <rect x="450" y="6" width="4" height="48" rx="2" />
      <rect x="462" y="15" width="4" height="30" rx="2" />
      <rect x="520" y="4" width="4" height="52" rx="2" />
      <rect x="532" y="18" width="4" height="24" rx="2" />
      <rect x="610" y="8" width="4" height="44" rx="2" />
      <rect x="622" y="2" width="4" height="56" rx="2" />
      <rect x="634" y="14" width="4" height="32" rx="2" />
      <rect x="710" y="10" width="4" height="40" rx="2" />
      <rect x="722" y="5" width="4" height="50" rx="2" />
      <rect x="790" y="12" width="4" height="36" rx="2" />
      <rect x="802" y="4" width="4" height="52" rx="2" />
      <rect x="814" y="18" width="4" height="24" rx="2" />
      <rect x="850" y="10" width="4" height="40" rx="2" />
    </g>

    <!-- Track 2: Guest Voice -->
    <g transform="translate(0, 90)">
      <text x="0" y="-12" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">CH 02 • GUEST AUDIO (CLEAN DIALOGUE CUTS)</text>
      <path d="M 0 30 L 920 30" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4" />
      <g fill="#94a3b8" opacity="0.6">
        <rect x="180" y="10" width="4" height="40" rx="2" />
        <rect x="192" y="3" width="4" height="54" rx="2" />
        <rect x="204" y="14" width="4" height="32" rx="2" />
        <rect x="330" y="6" width="4" height="48" rx="2" fill="#38bdf8" />
        <rect x="342" y="1" width="4" height="58" rx="2" fill="#38bdf8" />
        <rect x="354" y="12" width="4" height="36" rx="2" />
        <rect x="480" y="8" width="4" height="44" rx="2" />
        <rect x="492" y="3" width="4" height="54" rx="2" />
        <rect x="504" y="15" width="4" height="30" rx="2" />
        <rect x="560" y="10" width="4" height="40" rx="2" />
        <rect x="572" y="2" width="4" height="56" rx="2" />
        <rect x="660" y="8" width="4" height="44" rx="2" />
        <rect x="672" y="16" width="4" height="28" rx="2" />
        <rect x="740" y="6" width="4" height="48" rx="2" />
        <rect x="752" y="2" width="4" height="56" rx="2" />
      </g>
    </g>
  </g>

  <!-- Editorial Title Card Overlay -->
  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="168" height="28" rx="4" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
    <text x="14" y="19" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">PODCAST EDITING</text>
    <text x="0" y="70" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">Podcast Edit 01</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="400">Conversational pacing &amp; clean dialogue cuts</text>
  </g>

  <!-- Timeline Playhead & Ruler at Bottom -->
  <g transform="translate(80, 660)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <!-- Ticks -->
    <path d="M 0 0 L 0 6 M 112 0 L 112 4 M 224 0 L 224 6 M 336 0 L 336 4 M 448 0 L 448 6 M 560 0 L 560 4 M 672 0 L 672 6 M 784 0 L 784 4 M 896 0 L 896 6 M 1008 0 L 1008 4 M 1120 0 L 1120 6" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <!-- Playhead Marker -->
    <polygon points="448,-12 443,-2 448,0 453,-2" fill="#3b82f6" />
    <line x1="448" y1="0" x2="448" y2="-450" stroke="#3b82f6" stroke-width="1.5" opacity="0.4" />
  </g>
</svg>
