<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12" />
      <stop offset="50%" stop-color="#121620" />
      <stop offset="100%" stop-color="#171b26" />
    </linearGradient>
    <pattern id="grid-pattern-3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1" />
    </pattern>
    <filter id="soft-glow-3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bg-grad-3)" />
  <rect width="1280" height="720" fill="url(#grid-pattern-3)" />

  <!-- Ambient Light -->
  <circle cx="640" cy="300" r="280" fill="#2563eb" opacity="0.12" filter="url(#soft-glow-3)" />

  <!-- Cinema Frame Guides -->
  <rect x="40" y="40" width="1200" height="640" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Top Metadata Bar -->
  <text x="80" y="80" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="3">PK EDITS • A-ROLL PACING &amp; JUMP-CUTS</text>
  <text x="1100" y="80" fill="#3b82f6" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1">00:04:30:00</text>

  <!-- Viewfinder Overlay & Framing Grid -->
  <g transform="translate(320, 140)">
    <!-- 16:9 Viewfinder Window -->
    <rect width="640" height="360" rx="6" fill="#0d111a" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <!-- Rule of Thirds Lines -->
    <line x1="213" y1="0" x2="213" y2="360" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    <line x1="426" y1="0" x2="426" y2="360" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    <line x1="0" y1="120" x2="640" y2="120" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    <line x1="0" y1="240" x2="640" y2="240" stroke="rgba(255,255,255,0.04)" stroke-width="1" />

    <!-- Speaker Silhouette with Clean Focus Box -->
    <circle cx="320" cy="150" r="50" fill="rgba(59, 130, 246, 0.18)" />
    <path d="M 230 280 Q 320 220 410 280 Z" fill="rgba(59, 130, 246, 0.12)" />

    <!-- Eye-Line Guide & Face Detection Box -->
    <rect x="250" y="90" width="140" height="150" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 4" rx="4" />
    <line x1="240" y1="140" x2="400" y2="140" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1" />
    
    <!-- Cut Indicators (Jump-Cut Markers) -->
    <g transform="translate(20, 315)">
      <rect x="0" y="0" width="70" height="22" rx="3" fill="#1e293b" />
      <text x="8" y="15" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">CUT: 01.4s</text>
      
      <rect x="80" y="0" width="70" height="22" rx="3" fill="#1e293b" />
      <text x="88" y="15" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">PUNCH 1.1x</text>

      <rect x="160" y="0" width="70" height="22" rx="3" fill="#1e293b" />
      <text x="168" y="15" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">NO PAUSE</text>
    </g>

    <!-- REC dot -->
    <circle cx="590" cy="30" r="5" fill="#ef4444" />
    <text x="602" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">4K</text>
  </g>

  <!-- Editorial Title Card Overlay -->
  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="190" height="28" rx="4" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
    <text x="14" y="19" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">A-ROLL / TALKING-HEAD</text>
    <text x="0" y="70" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">Talking-Head Edit 01</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="400">Purposeful cuts, visual rhythm &amp; clear communication</text>
  </g>

  <!-- Timeline Playhead & Ruler at Bottom -->
  <g transform="translate(80, 660)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <polygon points="320,-12 315,-2 320,0 325,-2" fill="#3b82f6" />
    <line x1="320" y1="0" x2="320" y2="-450" stroke="#3b82f6" stroke-width="1.5" opacity="0.3" />
  </g>
</svg>
