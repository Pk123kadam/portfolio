<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12" />
      <stop offset="60%" stop-color="#101521" />
      <stop offset="100%" stop-color="#151b2a" />
    </linearGradient>
    <pattern id="grid-pattern-4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1" />
    </pattern>
    <filter id="soft-glow-4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bg-grad-4)" />
  <rect width="1280" height="720" fill="url(#grid-pattern-4)" />

  <!-- Ambient Light -->
  <circle cx="850" cy="280" r="280" fill="#1d4ed8" opacity="0.14" filter="url(#soft-glow-4)" />

  <!-- Cinema Frame Guides -->
  <rect x="40" y="40" width="1200" height="640" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Top Metadata Bar -->
  <text x="80" y="80" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="3">PK EDITS • B-ROLL INTEGRATION &amp; MOTION</text>
  <text x="1100" y="80" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1">00:06:15:22</text>

  <!-- Screen Content: Talking Head + B-Roll Overlay Card -->
  <g transform="translate(240, 140)">
    <!-- Main A-Roll Background Window -->
    <rect width="780" height="360" rx="8" fill="#0d111a" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Speaker Silhouette (Left side) -->
    <circle cx="200" cy="160" r="48" fill="rgba(255, 255, 255, 0.08)" />
    <path d="M 120 280 Q 200 230 280 280 Z" fill="rgba(255, 255, 255, 0.05)" />
    <text x="140" y="325" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">A-ROLL • PRIMARY</text>

    <!-- Overlay Callout / B-Roll Visual Card (Right side) -->
    <g transform="translate(380, 50)">
      <rect width="360" height="230" rx="6" fill="#141a27" stroke="#3b82f6" stroke-width="1.5" />
      <rect x="0" y="0" width="360" height="32" rx="6 6 0 0" fill="#1a2233" />
      <text x="16" y="21" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">B-ROLL OVERLAY • METRIC BREAKDOWN</text>
      
      <!-- Graph Animation Mockup inside B-Roll -->
      <path d="M 30 180 L 100 150 L 170 160 L 240 100 L 310 70" fill="none" stroke="#60a5fa" stroke-width="2.5" />
      <circle cx="310" cy="70" r="4" fill="#60a5fa" />
      
      <!-- Motion Callout Arrow & Tag -->
      <rect x="230" y="50" width="90" height="22" rx="4" fill="#2563eb" />
      <text x="242" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">+48% RETENTION</text>
      
      <!-- Lower Third Subtitle Demo -->
      <g transform="translate(20, 195)">
        <rect width="320" height="20" rx="3" fill="rgba(0,0,0,0.5)" />
        <text x="10" y="14" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="500">“...when you pace the dialogue directly to visual cues...”</text>
      </g>
    </g>
  </g>

  <!-- Editorial Title Card Overlay -->
  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="190" height="28" rx="4" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
    <text x="14" y="19" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">A-ROLL / TALKING-HEAD</text>
    <text x="0" y="70" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">Talking-Head Edit 02</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="400">Integrating supporting visuals &amp; maintaining attention</text>
  </g>

  <!-- Timeline Playhead & Ruler at Bottom -->
  <g transform="translate(80, 660)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <polygon points="560,-12 555,-2 560,0 565,-2" fill="#60a5fa" />
    <line x1="560" y1="0" x2="560" y2="-450" stroke="#60a5fa" stroke-width="1.5" opacity="0.3" />
  </g>
</svg>
